<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheVan Co., Ltd</title>
<!--
  VỎ TRANG — chỉ để có địa chỉ .pages.dev đẹp, web thật vẫn chạy trên Google Apps Script.
  CHỈ CẦN SỬA 1 DÒNG DUY NHẤT dưới đây rồi tải file này lên Cloudflare Pages (hoặc commit lên GitHub
  nếu bạn đã nối Git — Cloudflare tự build lại).

  Bản này NHÚNG web thật qua 1 lớp iframe duy nhất, để địa chỉ luôn giữ .pages.dev.
  Chỉ an toàn vì Home.html đã bỏ hết các khung lồng bên trong nó (khung xem trước
  Google Drive giờ mở tab mới, khung tra cứu SOP chỉ tải khi bấm) — nên tối đa chỉ
  lồng thêm 1 lớp nữa khi bạn bấm tra cứu SOP, không còn lồng 3-4 lớp như trước.
  Nếu sau này thấy web lại chậm/ăn RAM, đổi về bản chuyển hướng thẳng (không iframe).
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b1220;overflow:hidden}
  #cho{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#cbd5e1;font:15px/1.5 -apple-system,"Be Vietnam Pro",Arial,sans-serif;background:#0b1220;z-index:2}
  .vong{width:30px;height:30px;border:3px solid #27344a;border-top-color:#8bb4ff;
    border-radius:50%;animation:xoay 0.8s linear infinite;margin-right:10px}
  @keyframes xoay{to{transform:rotate(360deg)}}
  #loi{display:none;flex-direction:column;gap:14px;text-align:center;padding:24px}
  #loi a{color:#8bb4ff;text-decoration:none;font-weight:600}
  #khung{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
  noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#e2e8f0;font:15px/1.6 -apple-system,Arial,sans-serif;text-align:center;padding:24px;background:#0b1220}
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- SỬA DÒNG NÀY: dán link /exec đầy đủ của web TheVan (lấy ở     -->
<!-- tab QuanTri, dòng "Link web chính thức") vào giữa hai dấu ''   -->
<script>
  var LINK_WEB_THAT = 'https://script.google.com/macros/s/AKfycby3gLPvCyyHLNXBE3BSNgEKEq4LyPxikmTzydhm6wPEHtdLHSJ3dwbNZU4uwPkxKfxF/exec';
</script>
<!-- ============================================================ -->

<div id="cho"><span class="vong"></span>Đang mở TheVan…</div>
<div id="loi">
  <div>Chưa gắn link web — mở file này, sửa dòng LINK_WEB_THAT rồi tải lại lên Cloudflare Pages.</div>
</div>
<noscript><div>Vui lòng bật JavaScript trên trình duyệt để xem được trang này.</div></noscript>

<script>
(function () {
  var cho = document.getElementById('cho');
  var loi = document.getElementById('loi');

  if (!LINK_WEB_THAT || LINK_WEB_THAT.indexOf('XXXX') !== -1) {
    cho.style.display = 'none';
    loi.style.display = 'flex';
    return;
  }
  var kh = document.createElement('iframe');
  kh.id = 'khung';
  kh.src = LINK_WEB_THAT;
  kh.setAttribute('loading', 'eager');
  kh.addEventListener('load', function () { cho.style.display = 'none'; });
  document.body.appendChild(kh);
})();
</script>
</body>
</html>
